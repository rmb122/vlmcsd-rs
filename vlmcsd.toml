# Listen on a single IPv4 or IPv6 socket, for example "[::]:1688".
listen = "0.0.0.0:1688"

# Eight bytes, written as exactly 16 hexadecimal digits.
hwid = "3A1C049600B60076"
activation_interval_minutes = 120
renewal_interval_minutes = 10080

# Filtering is only active when enable is true (default: false).
# When enabled, both lists must match; empty or omitted lists deny activation.
# Patterns use Rust regex syntax. Use single quotes to preserve backslashes.
[whitelist]
enable = false
hostnames = [
    # '(?i)^pc-[0-9]+\.example\.local$',
]
ips = [
    # '^192\.168\.10\.[0-9]{1,3}$',
    # '^127\.0\.0\.1$',
]

# Stable server identities. Omitted entries use these built-in defaults.
[epids]
windows = "03612-00206-556-123727-03-1033-17763.0000-2972018"
win_china_gov = "03612-03858-053-089516-03-1033-17763.0000-2972018"
office2010 = "03612-00096-199-799188-03-1033-17763.0000-2972018"
office2013 = "03612-00206-240-719639-03-1033-17763.0000-2972018"
office2016 = "03612-00206-438-004532-03-1033-17763.0000-2972018"
office2019 = "03612-00206-684-137669-03-1033-17763.0000-2972018"
